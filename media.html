<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media | Game Title</title>
    <link rel="icon" href="icons/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      defer
    ></script>
  </head>
  <body>
    <header
      hx-get="components/header.html"
      hx-trigger="load"
      hx-swap="outerHTML"
    ></header>
    <section class="heroImage-container">
      <img
        src="images/screenshot_forestMoonlight.webp"
        alt="Dark forest scene at night with tall trees and a fallen tree across a slope."
      />
    </section>
    <div class="mediaButtons">
      <button class="mediaSelection active" data-target="videos">VIDEOS</button>
      <button class="mediaSelection" data-target="screenshots">
        SCREENSHOTS
      </button>
    </div>

    <section class="mediaContent" id="videos">
      <div class="mediaGrid">
        <div class="mediaCard">
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ "
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="mediaCard">
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ "
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="mediaCard">
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="mediaCard">
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="mediaCard">
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            allowfullscreen
          >
          </iframe>
        </div>
        <div class="mediaCard">
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            allowfullscreen
          >
          </iframe>
        </div>
      </div>
    </section>

    <section class="mediaContent hidden" id="screenshots">
      <div class="mediaGrid">
        <div class="mediaCard">
          <button type="button">
            <img
              src="images/screenshot_basementDoor.webp"
              alt="Dimly lit hallway with an open door leading to a dark basement"
            />
          </button>
        </div>
        <div class="mediaCard">
          <button type="button">
            <img
              src="images/screenshot_crimeScene.webp"
              alt="Forest path blocked by yellow police tape stretched between two brick pillars with trees and fog in the background"
            />
          </button>
        </div>
        <div class="mediaCard">
          <button type="button">
            <img
              src="images/screenshot_forestAtNight.webp"
              alt="Dark forest scene at night illuminated by blue light from a police car shining through the trees"
            />
          </button>
        </div>
        <div class="mediaCard">
          <button type="button">
            <img
              src="images/screenshot_houseAtNight.webp"
              alt="House in a dark forest at night with red light glowing from a window"
            />
          </button>
        </div>
        <div class="mediaCard">
          <button type="button">
            <img
              src="images/screenshot_houseHallway.webp"
              alt="Dimly lit narrow hallway with wooden floor and ceiling lights, open doorway revealing a dark staircase"
            />
          </button>
        </div>
        <div class="mediaCard">
          <button type="button">
            <img
              src="images/screenshot_redHallway.webp"
              alt="Long narrow hallway with wooden floor and closed doors on both sides illuminated by intense red light from an open doorway at the end"
            />
          </button>
        </div>
      </div>
    </section>
    <div class="pagination">
      <span class="pageLink active" aria-current="page">1</span>
      <span class="pageLink pageLink--disabled" aria-disabled="true">2</span>
      <span class="pageLink pageLink--disabled" aria-disabled="true">3</span>
    </div>

    <section class="newsletter">
      <div
        hx-get="components/newsletter.html"
        hx-trigger="load"
        hx-swap="outerHTML"
      ></div>
    </section>

    <footer>
      <div
        hx-get="components/footer.html"
        hx-trigger="load"
        hx-swap="outerHTML"
      ></div>
    </footer>
    <script src="scripts/script.js"></script>
    <div class="lightbox" id="lightbox">
      <button class="lightboxClose" type="button" aria-label="Close lightbox">
        ✕
      </button>
      <img src="" alt="Screenshot" id="lightboxImg" />
    </div>
  </body>
</html>
